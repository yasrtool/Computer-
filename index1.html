<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار الحاسبات - م.م. إيناس سعيد مراد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --card: #1a2236;
    --border: #2a3a55;
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --accent3: #10b981;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --correct: #10b981;
    --wrong: #ef4444;
    --warn: #f59e0b;
    --glow: 0 0 20px rgba(0,212,255,0.3);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    background-image: 
      radial-gradient(ellipse at 20% 10%, rgba(0,212,255,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(124,58,237,0.06) 0%, transparent 50%);
  }

  /* ===== SCREENS ===== */
  .screen { display: none; }
  .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

  /* ===== INTRO ===== */
  #intro-screen {
    text-align: center;
    gap: 24px;
  }
  .hero-icon {
    font-size: 64px;
    animation: pulse 2s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(0,212,255,0.5));
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  .hero-title {
    font-family: 'Tajawal', sans-serif;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 900;
    background: linear-gradient(135deg, #00d4ff, #7c3aed, #10b981);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -1px;
  }
  .hero-sub {
    color: var(--text-dim);
    font-size: 15px;
    line-height: 1.8;
  }
  .hero-sub strong { color: var(--accent); }
  .stats-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat-chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 8px 20px;
    font-size: 13px;
    color: var(--accent);
    font-weight: 700;
  }
  .name-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .name-box label { font-size: 14px; color: var(--text-dim); }
  .name-box input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    direction: rtl;
  }
  .name-box input:focus { border-color: var(--accent); box-shadow: var(--glow); }

  .btn-start {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    border: none;
    border-radius: 14px;
    padding: 16px 48px;
    font-family: 'Cairo', sans-serif;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 24px rgba(0,212,255,0.3);
    letter-spacing: 0.5px;
  }
  .btn-start:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,212,255,0.4); }

  /* ===== SECTION SELECT ===== */
  #section-screen { gap: 24px; }
  .section-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 900px;
  }
  .section-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .section-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    opacity: 0;
    transition: opacity 0.3s;
  }
  .section-card:hover { transform: translateY(-4px); border-color: var(--accent); }
  .section-card:hover::before { opacity: 0.06; }
  .section-card .sec-num {
    font-size: 32px;
    font-weight: 900;
    color: var(--accent);
    font-family: 'Tajawal', sans-serif;
  }
  .section-card .sec-title {
    font-size: 15px;
    font-weight: 700;
    margin: 8px 0 4px;
  }
  .section-card .sec-count {
    font-size: 12px;
    color: var(--text-dim);
  }
  .section-card .sec-score {
    margin-top: 10px;
    font-size: 12px;
    color: var(--accent3);
    font-weight: 600;
  }
  .section-card.done { border-color: var(--accent3); }
  .section-card.done .sec-num { color: var(--accent3); }

  /* ===== EXAM SCREEN ===== */
  #exam-screen { 
    align-items: stretch; 
    padding: 0;
    justify-content: flex-start;
  }
  .exam-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .exam-header-right { display: flex; align-items: center; gap: 12px; }
  .sec-badge {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    padding: 4px 14px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 700;
  }
  .q-counter {
    font-size: 14px;
    color: var(--text-dim);
  }
  .q-counter span { color: var(--text); font-weight: 700; }
  .progress-bar-wrap {
    flex: 1;
    min-width: 120px;
    max-width: 300px;
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .btn-submit-sec {
    background: var(--card);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 10px;
    padding: 8px 18px;
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-submit-sec:hover { background: var(--accent); color: var(--bg); }

  .exam-body {
    flex: 1;
    padding: 24px;
    max-width: 800px;
    margin: 0 auto;
    width: 100%;
  }
  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px;
    margin-bottom: 20px;
    transition: all 0.3s;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .q-num-badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: white;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    flex-shrink: 0;
  }
  .q-text {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.7;
    margin-bottom: 18px;
    color: var(--text);
  }
  .options-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option-btn {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 13px 18px;
    text-align: right;
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .option-btn:hover:not([disabled]) { border-color: var(--accent); background: rgba(0,212,255,0.05); }
  .option-btn.selected { border-color: var(--accent); background: rgba(0,212,255,0.08); }
  .option-btn.correct { border-color: var(--correct); background: rgba(16,185,129,0.1); color: var(--correct); }
  .option-btn.wrong { border-color: var(--wrong); background: rgba(239,68,68,0.1); color: var(--wrong); }
  .option-letter {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    flex-shrink: 0;
  }
  .correct .option-letter { background: var(--correct); color: white; }
  .wrong .option-letter { background: var(--wrong); color: white; }

  /* ===== RESULTS ===== */
  #result-screen { gap: 24px; text-align: center; }
  .result-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: conic-gradient(var(--accent3) var(--pct, 0%), var(--border) 0%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    animation: rotatein 1s ease;
  }
  @keyframes rotatein {
    from { transform: rotate(-180deg) scale(0.5); opacity: 0; }
    to { transform: rotate(0) scale(1); opacity: 1; }
  }
  .result-circle-inner {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .result-pct { font-size: 28px; font-weight: 900; color: var(--accent3); }
  .result-pct-label { font-size: 11px; color: var(--text-dim); }
  .result-title { font-size: 22px; font-weight: 900; }
  .result-stats {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .result-stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 24px;
    min-width: 100px;
  }
  .result-stat .val { font-size: 24px; font-weight: 900; }
  .result-stat .lbl { font-size: 12px; color: var(--text-dim); }
  .correct-val { color: var(--correct); }
  .wrong-val { color: var(--wrong); }
  .result-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn-secondary {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 12px 28px;
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  /* ===== FINAL RESULTS ===== */
  #final-screen { gap: 28px; text-align: center; }
  .trophy { font-size: 72px; animation: bounce 1s ease; }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    40% { transform: translateY(-20px); }
    60% { transform: translateY(-10px); }
  }
  .final-name { font-size: 20px; font-weight: 700; color: var(--accent); }
  .final-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    width: 100%;
    max-width: 700px;
  }
  .final-sec-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .final-sec-card .fsec-title { font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  .final-sec-card .fsec-score { font-size: 20px; font-weight: 900; color: var(--accent3); }
  .total-score-box {
    background: var(--card);
    border: 2px solid var(--accent);
    border-radius: 20px;
    padding: 24px 48px;
    box-shadow: var(--glow);
  }
  .total-score-box .total-lbl { font-size: 14px; color: var(--text-dim); }
  .total-score-box .total-val {
    font-size: 48px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro-screen" class="screen active">
  <div class="hero-icon">🖥️</div>
  <div class="hero-title">COMPUTER SCIENCE EXAM</div>
  <div class="hero-sub">
    <strong>م.م. إيناس سعيد مراد</strong> · كلية التربية · المرحلة الثانية<br>
    اختبار شامل لمادة الحاسبات
  </div>
  <div class="stats-row">
    <div class="stat-chip">📚 9 أقسام</div>
    <div class="stat-chip">❓ 225 سؤال</div>
    <div class="stat-chip">✔️ اختيار من متعدد</div>
  </div>
  <div class="name-box">
    <label>الاسم الثلاثي</label>
    <input type="text" id="student-name" placeholder="أدخل اسمك الثلاثي...">
  </div>
  <button class="btn-start" onclick="startExam()">▶ ابدأ الاختبار</button>
  <div style="font-size:12px;color:var(--text-dim)">إعداد: م.م. إيناس سعيد مراد</div>
</div>

<!-- SECTION SELECT -->
<div id="section-screen" class="screen">
  <div style="text-align:center;margin-bottom:8px;">
    <div style="font-size:22px;font-weight:900;color:var(--accent)">اختر القسم</div>
    <div style="font-size:13px;color:var(--text-dim);margin-top:4px;" id="student-display"></div>
  </div>
  <div class="section-grid" id="section-grid"></div>
  <button class="btn-secondary" onclick="showFinal()" id="final-btn" style="display:none">🏆 عرض النتيجة النهائية</button>
</div>

<!-- EXAM -->
<div id="exam-screen" class="screen">
  <div class="exam-header">
    <div class="exam-header-right">
      <span class="sec-badge" id="sec-badge">القسم 1</span>
      <span class="q-counter">السؤال <span id="q-current">1</span> / <span id="q-total">25</span></span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <button class="btn-submit-sec" onclick="submitSection()">تسليم القسم ▶</button>
  </div>
  <div class="exam-body" id="exam-body"></div>
</div>

<!-- SECTION RESULT -->
<div id="result-screen" class="screen">
  <div class="result-circle" id="result-circle">
    <div class="result-circle-inner">
      <div class="result-pct" id="result-pct">0%</div>
      <div class="result-pct-label">النتيجة</div>
    </div>
  </div>
  <div class="result-title" id="result-title"></div>
  <div class="result-stats">
    <div class="result-stat"><div class="val correct-val" id="r-correct">0</div><div class="lbl">✅ صحيح</div></div>
    <div class="result-stat"><div class="val wrong-val" id="r-wrong">0</div><div class="lbl">❌ خطأ</div></div>
    <div class="result-stat"><div class="val" id="r-skip" style="color:var(--warn)">0</div><div class="lbl">⏭️ محذوف</div></div>
  </div>
  <div class="result-actions">
    <button class="btn-start" onclick="goToSections()">↩ العودة للأقسام</button>
    <button class="btn-secondary" onclick="reviewSection()">🔍 مراجعة الإجابات</button>
  </div>
</div>

<!-- FINAL -->
<div id="final-screen" class="screen">
  <div class="trophy" id="trophy-icon">🏆</div>
  <div class="final-name" id="final-name"></div>
  <div style="font-size:15px;color:var(--text-dim)">نتائج جميع الأقسام</div>
  <div class="final-grid" id="final-grid"></div>
  <div class="total-score-box">
    <div class="total-lbl">المجموع الكلي</div>
    <div class="total-val" id="total-val">0 / 225</div>
    <div style="font-size:14px;color:var(--text-dim);margin-top:4px;" id="total-grade"></div>
  </div>
  <div class="result-actions">
    <button class="btn-start" onclick="resetAll()">🔄 إعادة الاختبار</button>
    <button class="btn-secondary" onclick="goToSections()">↩ الأقسام</button>
  </div>
</div>

<script>
// =================== QUESTIONS DATA ===================
const SECTIONS = [
  {
    title: "تكنولوجيا المعلومات والمفاهيم الأساسية",
    questions: [
      { q:"ما هو تعريف تكنولوجيا المعلومات (IT)؟", o:["مصطلح يتعلق باستخدام الحواسيب كوسيلة مساعدة لإنشاء وصيانة البيانات","برنامج لتصميم المواقع الإلكترونية فقط","نظام لإدارة الموارد البشرية فقط","جهاز لمعالجة الصوت والصورة فقط"], a:0},
      { q:"تتصل تكنولوجيا المعلومات بجميع جوانب:", o:["إدارة ومعالجة المعلومات خاصة داخل المؤسسات الكبيرة","تصميم الأثاث المكتبي","إنتاج المواد الغذائية","بناء الطرق والجسور"], a:0},
      { q:"أي مما يلي يمثل دوراً لتكنولوجيا المعلومات في أعمال المبيعات؟", o:["تحليل الموقع لتحديد أفضل مكان للإنتاج والتوزيع","إنتاج المواد الخام","بناء المصانع","تعيين العمال"], a:0},
      { q:"ما المقصود بـ 'زيادة الكفاءة' في دور تكنولوجيا المعلومات؟", o:["زيادة كفاءة عمليات الأعمال والاتصالات بين موظفيها","تقليل عدد الموظفين فقط","رفع أسعار المنتجات","تقليل ساعات العمل اليومية"], a:0},
      { q:"ما المقصود بـ 'العمل بذكاء' في تكنولوجيا المعلومات؟", o:["تغيير طريقة هيكلة وإدارة الأنظمة وعملياتها","العمل لساعات أطول","استخدام أدوات يدوية بدلاً من الرقمية","تقليل استخدام الإنترنت"], a:0},
      { q:"من منظور تكنولوجيا المعلومات، ما الذي يجب على كل مدير ومحلل معرفته؟", o:["كيفية بناء واستخدام وإدارة الأنظمة الناجحة المعتمدة على IT","كيفية صيانة السيارات","كيفية طبخ الطعام","كيفية بناء المباني"], a:0},
      { q:"أي مما يلي مثال على استخدام IT في المبيعات والتسويق؟", o:["تحديد أفضل إعلان لتحقيق أعلى إجمالي إيرادات","إنتاج المواد الخام","تصنيع المركبات","بناء المستودعات"], a:0},
      { q:"ما الهدف من 'تحليل السعر' في تكنولوجيا المعلومات؟", o:["تحديد أسعار المنتجات للحصول على أعلى إجمالي إيرادات","تقليل تكاليف الإنتاج فقط","رفع راتب الموظفين","تخفيض جودة المنتج"], a:0},
      { q:"ما هو تعريف الحاسوب (Computer)؟", o:["جهاز إلكتروني قابل للبرمجة ومتعدد الاستخدامات يقبل البيانات ويعالجها","جهاز لطباعة الوثائق فقط","جهاز لبث الإذاعة والتلفزيون","جهاز لتخزين الكتب الورقية"], a:0},
      { q:"ما النظام الذي تعتمد عليه الحواسيب في عملها؟", o:["النظام الثنائي (Binary System) باستخدام الرقمين 0 و 1","النظام العشري فقط","النظام الستيني","النظام الثماني فقط"], a:0},
